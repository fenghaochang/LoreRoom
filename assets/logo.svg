<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LoreRoom logo">
  <defs>
    <linearGradient id="lr-g" x1="40" y1="24" x2="470" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29B0F0"/>
      <stop offset="1" stop-color="#5B3FD6"/>
    </linearGradient>
  </defs>

  <!-- sharp square tile, full bleed, no rounded corners, no border -->
  <rect width="512" height="512" fill="url(#lr-g)"/>

  <!-- oval speech bubble (white) with a tail -->
  <g fill="#ffffff">
    <ellipse cx="256" cy="208" rx="152" ry="106"/>
    <path d="M198 300 L166 360 L240 304 Z"/>
  </g>

  <!-- keyhole, dark for high contrast -->
  <g fill="#1b2147">
    <circle cx="256" cy="190" r="31"/>
    <path d="M238 208 H274 L264 290 a3 3 0 0 1 -3 2.8 H241 a3 3 0 0 1 -3 -2.8 Z"/>
  </g>
</svg>
