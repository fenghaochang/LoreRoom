<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LoreRoom — 示意</title>
<style>
  :root{ --bg:#0e1621; --in:#1b2735; --out:#2b5278; --head:#17212b; --txt:#fff; --sub:#7c8c9c; --accent:#4aa8e6; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:-apple-system,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(1000px 700px at 50% -10%,#1d2c3b,#0a0f16 60%);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .wrap{width:400px;max-width:100%;}
  .phone{background:var(--bg);border-radius:32px;overflow:hidden;border:1px solid rgba(255,255,255,.06);
    box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .head{background:var(--head);padding:14px 16px;display:flex;align-items:center;gap:11px;}
  .back{color:var(--accent);font-size:20px;}
  .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#6C53E6);
    display:flex;align-items:center;justify-content:center;font-size:19px;}
  .nm{color:#fff;font-weight:600;font-size:15.5px;}
  .st{color:var(--accent);font-size:12.5px;margin-top:1px;}
  .chat{padding:16px 14px 20px;display:flex;flex-direction:column;gap:8px;
    background:linear-gradient(180deg,rgba(20,32,46,.45),var(--bg));}
  .day{align-self:center;background:rgba(0,0,0,.3);color:#c2d0dc;font-size:12px;padding:3px 11px;border-radius:11px;margin:2px 0 4px;}
  .row{display:flex;}.row.out{justify-content:flex-end;}
  .b{max-width:82%;padding:8px 12px 6px;border-radius:15px;color:var(--txt);font-size:15px;line-height:1.5;}
  .in .b{background:var(--in);border-bottom-left-radius:5px;}
  .out .b{background:var(--out);border-bottom-right-radius:5px;}
  .t{display:block;text-align:right;color:var(--sub);font-size:11px;margin-top:2px;}
  .out .t{color:#a9cdf0;}
  .b b{color:#bfe6ff;font-weight:600;}
  .recall{color:#8fd3ff;font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.09);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 2px 0;justify-content:center;}
  .chip{background:rgba(42,171,238,.12);border:1px solid rgba(42,171,238,.3);color:#cfe9fb;font-size:12.5px;padding:5px 10px;border-radius:999px;}
  .foot{text-align:center;color:#6b7e8f;font-size:12px;margin-top:14px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <div class="head">
        <span class="back">‹</span>
        <div class="av">🤖</div>
        <div><div class="nm">AI 助理</div><div class="st">bot</div></div>
      </div>
      <div class="chat">
        <div class="day">今天</div>

        <div class="row out"><div class="b">我們上週討論的爬蟲重試方案是什麼？<span class="t">14:32 ✓✓</span></div></div>

        <div class="row in"><div class="b">上週二晚上 23:42 你決定：<b>重試上限 5 次、指數退避</b>，我也把 diff 傳給你了。<span class="t">14:32</span></div></div>

        <div class="row out"><div class="b">那個 API key 我存哪了？<span class="t">14:33 ✓✓</span></div></div>

        <div class="row in"><div class="b">6/2 下午你貼在「設定」那則訊息裡，要我幫你找出來嗎？<span class="t">14:33</span></div></div>

        <div class="row out"><div class="b">太好了，你居然都記得 🙌<span class="t">14:34 ✓✓</span></div></div>

        <div class="row in"><div class="b">當然，這些對話都在 LoreRoom 裡 🔒
          <div class="recall">🧠 由 <b>LoreRoom</b> 回憶 · 加密、本機、雙向</div>
          <span class="t">14:34</span></div></div>
      </div>
    </div>
    <div class="chips">
      <span class="chip">✅ 雙向側錄</span>
      <span class="chip">🔁 重啟也不漏</span>
      <span class="chip">🔒 加密 · 本機</span>
      <span class="chip">🔎 全文搜尋</span>
    </div>
    <div class="foot">換一個全新 session 本來會忘光 —— LoreRoom 沒有。</div>
  </div>
</body>
</html>
