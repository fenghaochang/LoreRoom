<svg width="430" height="784" viewBox="0 0 430 784" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif">
  <defs>
    <clipPath id="r"><rect width="430" height="784" rx="26"/></clipPath>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2AABEE"/><stop offset="1" stop-color="#6C53E6"/></linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="430" height="784" fill="#0e1621"/>

    <!-- header -->
    <rect width="430" height="62" fill="#17212b"/>
    <text x="20" y="38" fill="#5aa7e0" font-size="22">‹</text>
    <circle cx="52" cy="31" r="19" fill="url(#av)"/>
    <text x="52" y="38" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">L</text>
    <text x="80" y="27" fill="#fff" font-size="16" font-weight="600">LoreRoom</text>
    <text x="80" y="44" fill="#7c8c9c" font-size="12.5">bot</text>
    <circle cx="372" cy="29" r="7.5" fill="none" stroke="#8696a5" stroke-width="2"/>
    <line x1="377" y1="34" x2="383" y2="40" stroke="#8696a5" stroke-width="2" stroke-linecap="round"/>
    <g fill="#8696a5"><circle cx="406" cy="23" r="2.2"/><circle cx="406" cy="31" r="2.2"/><circle cx="406" cy="39" r="2.2"/></g>

    <!-- chat -->
    <rect x="195" y="80" width="40" height="20" rx="10" fill="#00000055"/>
    <text x="215" y="94" fill="#c2d0dc" font-size="12" text-anchor="middle">Today</text>

    <rect x="148" y="110" width="268" height="58" rx="14" fill="#2b5278"/>
    <text x="162" y="132" fill="#fff" font-size="15">What did we decide about the</text>
    <text x="162" y="154" fill="#fff" font-size="15">crawler retries last week? <tspan fill="#a9cdf0" font-size="11">14:53 ✓✓</tspan></text>

    <rect x="14" y="176" width="302" height="80" rx="14" fill="#1b2735"/>
    <text x="28" y="198" fill="#fff" font-size="15">Last Tue 23:42 you decided: <tspan fill="#bfe6ff">cap</tspan></text>
    <text x="28" y="220" fill="#bfe6ff" font-size="15">retries at 5, exponential backoff</text>
    <text x="28" y="242" fill="#fff" font-size="15">— and I sent you the diff too.</text>

    <rect x="178" y="266" width="238" height="38" rx="14" fill="#2b5278"/>
    <text x="192" y="289" fill="#fff" font-size="15">Where did I save that API key?</text>

    <rect x="14" y="314" width="278" height="58" rx="14" fill="#1b2735"/>
    <text x="28" y="336" fill="#fff" font-size="15">You pasted it on Jun 2 in the</text>
    <text x="28" y="358" fill="#fff" font-size="15">“settings” message. Want it?</text>

    <rect x="166" y="382" width="250" height="38" rx="14" fill="#2b5278"/>
    <text x="180" y="405" fill="#fff" font-size="15">Nice — you remembered it all! 🙌</text>

    <rect x="14" y="430" width="338" height="82" rx="14" fill="#1b2735"/>
    <text x="28" y="452" fill="#fff" font-size="15">Of course — it's all in LoreRoom 🔒</text>
    <line x1="28" y1="468" x2="338" y2="468" stroke="#ffffff18"/>
    <text x="28" y="490" fill="#8fd3ff" font-size="13">🧠 recalled by <tspan fill="#bfe6ff" font-weight="600">LoreRoom</tspan> · encrypted · both sides</text>

    <!-- input bar -->
    <rect x="0" y="716" width="430" height="68" fill="#17212b"/>
    <circle cx="36" cy="750" r="19" fill="#3390d6"/>
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="28" y1="744" x2="44" y2="744"/><line x1="28" y1="750" x2="44" y2="750"/><line x1="28" y1="756" x2="44" y2="756"/></g>
    <text x="72" y="756" fill="#5a6b7a" font-size="15">📎  Write a message…</text>
    <text x="365" y="757" font-size="18">🙂</text>
    <text x="397" y="757" font-size="18">🎤</text>
  </g>
</svg>
