<svg width="430" height="784" viewBox="0 0 430 784" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',system-ui,sans-serif">
  <defs>
    <clipPath id="r"><rect width="430" height="784" rx="26"/></clipPath>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2AABEE"/><stop offset="1" stop-color="#6C53E6"/></linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="430" height="784" fill="#0e1621"/>

    <!-- header -->
    <rect width="430" height="62" fill="#17212b"/>
    <text x="20" y="38" fill="#5aa7e0" font-size="22">‹</text>
    <circle cx="52" cy="31" r="19" fill="url(#av)"/>
    <text x="52" y="38" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">L</text>
    <text x="80" y="27" fill="#fff" font-size="16" font-weight="600">LoreRoom</text>
    <text x="80" y="44" fill="#7c8c9c" font-size="12.5">bot</text>
    <circle cx="372" cy="29" r="7.5" fill="none" stroke="#8696a5" stroke-width="2"/>
    <line x1="377" y1="34" x2="383" y2="40" stroke="#8696a5" stroke-width="2" stroke-linecap="round"/>
    <g fill="#8696a5"><circle cx="406" cy="23" r="2.2"/><circle cx="406" cy="31" r="2.2"/><circle cx="406" cy="39" r="2.2"/></g>

    <!-- chat -->
    <rect x="195" y="80" width="40" height="20" rx="10" fill="#00000055"/>
    <text x="215" y="94" fill="#c2d0dc" font-size="12" text-anchor="middle">今天</text>

    <rect x="100" y="110" width="316" height="38" rx="14" fill="#2b5278"/>
    <text x="114" y="133" fill="#fff" font-size="15">我們上週討論的爬蟲重試方案是什麼？</text>

    <rect x="14" y="158" width="318" height="60" rx="14" fill="#1b2735"/>
    <text x="28" y="181" fill="#fff" font-size="15">上週二 23:42 你決定：<tspan fill="#bfe6ff">重試上限 5 次、</tspan></text>
    <text x="28" y="203" fill="#fff" font-size="15"><tspan fill="#bfe6ff">指數退避</tspan>，diff 也傳給你了。</text>

    <rect x="206" y="228" width="210" height="38" rx="14" fill="#2b5278"/>
    <text x="220" y="251" fill="#fff" font-size="15">那個 API key 我存哪了？</text>

    <rect x="14" y="276" width="320" height="60" rx="14" fill="#1b2735"/>
    <text x="28" y="299" fill="#fff" font-size="15">6/2 下午你貼在「設定」那則訊息裡，</text>
    <text x="28" y="321" fill="#fff" font-size="15">要我幫你找出來嗎？</text>

    <rect x="214" y="346" width="202" height="38" rx="14" fill="#2b5278"/>
    <text x="228" y="369" fill="#fff" font-size="15">太好了，你居然都記得！🙌</text>

    <rect x="14" y="394" width="334" height="82" rx="14" fill="#1b2735"/>
    <text x="28" y="417" fill="#fff" font-size="15">當然，這些對話都在 LoreRoom 裡 🔒</text>
    <line x1="28" y1="433" x2="334" y2="433" stroke="#ffffff18"/>
    <text x="28" y="455" fill="#8fd3ff" font-size="13">🧠 由 <tspan fill="#bfe6ff" font-weight="600">LoreRoom</tspan> 回憶 · 加密 · 本機 · 雙向</text>

    <!-- input bar -->
    <rect x="0" y="716" width="430" height="68" fill="#17212b"/>
    <circle cx="36" cy="750" r="19" fill="#3390d6"/>
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="28" y1="744" x2="44" y2="744"/><line x1="28" y1="750" x2="44" y2="750"/><line x1="28" y1="756" x2="44" y2="756"/></g>
    <text x="72" y="756" fill="#5a6b7a" font-size="15">📎  輸入訊息…</text>
    <text x="365" y="757" font-size="18">🙂</text>
    <text x="397" y="757" font-size="18">🎤</text>
  </g>
