<svg width="430" height="612" viewBox="0 0 430 612" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <defs>
    <clipPath id="r"><rect width="430" height="612" rx="24"/></clipPath>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2AABEE"/><stop offset="1" stop-color="#6C53E6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#r)">
    <rect width="430" height="612" fill="#0e1621"/>

    <!-- header -->
    <rect width="430" height="58" fill="#17212b"/>
    <circle cx="38" cy="29" r="17" fill="url(#av)"/>
    <text x="38" y="35" font-size="16" text-anchor="middle">🤖</text>
    <text x="64" y="26" fill="#fff" font-size="15" font-weight="600">AI 助理</text>
    <text x="64" y="42" fill="#4aa8e6" font-size="12">bot</text>

    <!-- day -->
    <rect x="195" y="72" width="40" height="20" rx="10" fill="#00000055"/>
    <text x="215" y="86" fill="#c2d0dc" font-size="12" text-anchor="middle">今天</text>

    <!-- 1 out -->
    <rect x="110" y="102" width="306" height="36" rx="14" fill="#2b5278"/>
    <text x="124" y="125" fill="#fff" font-size="15">我們上週討論的爬蟲重試方案是什麼？</text>

    <!-- 2 in -->
    <rect x="14" y="146" width="318" height="58" rx="14" fill="#1b2735"/>
    <text x="28" y="169" fill="#fff" font-size="15">上週二 23:42 你決定：<tspan fill="#bfe6ff">重試上限 5 次、</tspan></text>
    <text x="28" y="191" fill="#fff" font-size="15"><tspan fill="#bfe6ff">指數退避</tspan>，diff 也傳給你了。</text>

    <!-- 3 out -->
    <rect x="206" y="212" width="210" height="36" rx="14" fill="#2b5278"/>
    <text x="220" y="235" fill="#fff" font-size="15">那個 API key 我存哪了？</text>

    <!-- 4 in -->
    <rect x="14" y="256" width="320" height="58" rx="14" fill="#1b2735"/>
    <text x="28" y="279" fill="#fff" font-size="15">6/2 下午你貼在「設定」那則訊息裡，</text>
    <text x="28" y="301" fill="#fff" font-size="15">要我幫你找出來嗎？</text>

    <!-- 5 out -->
    <rect x="216" y="322" width="200" height="36" rx="14" fill="#2b5278"/>
    <text x="230" y="345" fill="#fff" font-size="15">太好了，你居然都記得！</text>

    <!-- 6 in + recall -->
    <rect x="14" y="366" width="332" height="80" rx="14" fill="#1b2735"/>
    <text x="28" y="389" fill="#fff" font-size="15">當然，這些對話都在 LoreRoom 裡 🔒</text>
    <line x1="28" y1="404" x2="332" y2="404" stroke="#ffffff18"/>
    <text x="28" y="426" fill="#8fd3ff" font-size="13">🧠 由 <tspan fill="#bfe6ff" font-weight="600">LoreRoom</tspan> 回憶 · 加密 · 本機 · 雙向</text>

    <!-- chips -->
    <g font-size="12.5" fill="#cfe9fb" text-anchor="middle">
      <rect x="22"  y="470" width="92"  height="28" rx="14" fill="#2aabee1f" stroke="#2aabee4d"/>
      <text x="68"  y="488">✅ 雙向側錄</text>
      <rect x="122" y="470" width="104" height="28" rx="14" fill="#2aabee1f" stroke="#2aabee4d"/>
      <text x="174" y="488">🔁 重啟不漏</text>
      <rect x="234" y="470" width="92"  height="28" rx="14" fill="#2aabee1f" stroke="#2aabee4d"/>
      <text x="280" y="488">🔒 加密本機</text>
      <rect x="334" y="470" width="84"  height="28" rx="14" fill="#2aabee1f" stroke="#2aabee4d"/>
      <text x="376" y="488">🔎 全文搜尋</text>
    </g>

    <!-- foot -->
    <text x="215" y="560" fill="#6b7e8f" font-size="13" text-anchor="middle">換一個全新 session 本來會忘光，</text>
    <text x="215" y="582" fill="#6b7e8f" font-size="13" text-anchor="middle">LoreRoom 沒有。</text>
  </g>
</svg>
